name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Change to master if your default branch is master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Match your target .NET version

    - name: Publish Application
      run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/release src/WebApp/WebApp.csproj
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages # The branch the action will deploy to
        folder: release/wwwroot # The target directory generated by dotnet publish
